name: Research prototype checks

on:
  push:
    paths:
      - 'research/prototype_0/**'
      - '.github/workflows/research-prototype.yml'
  pull_request:
    paths:
      - 'research/prototype_0/**'
      - '.github/workflows/research-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: research/prototype_0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q prototype.py evaluate_baseline.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check synthetic evaluation cases
        run: python evaluate_baseline.py
      - name: Check historical replay
        run: |
          python -c 'import json, subprocess, sys; a=json.loads(subprocess.check_output([sys.executable, "prototype.py", "--as-of", "2026-02-09T12:00:00Z"])); assert a["findings"] == []'
